name: Update GreekTube Playlist (SB-Sniffer)

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable

      - name: Install Python Dependencies
        run: |
          pip install seleniumbase beautifulsoup4
          seleniumbase install chromedriver

      - name: Run Scraper
        run: xvfb-run python scraper.py

      # --- ΝΕΟ: Ανεβάζει το Screenshot αν αποτύχει η Φάση 1 ---
      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          if-no-files-found: ignore

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          if [ -s GrTube.m3u ]; then
            git add GrTube.m3u
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update playlist" && git push)
            echo "✅ Changes pushed successfully."
          else
            echo "⚠️ Playlist is empty or missing. Skipping commit."
          fi
